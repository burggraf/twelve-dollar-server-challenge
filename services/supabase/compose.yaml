# API-serving subset of official Supabase docker commit 7767e1ab6ef0914ba77d5835a4255fff8de90966.
# All FIVE serving containers share ONE verified systemd slice, not 4 GiB each.
x-serving: &serving
  platform: linux/amd64
  cgroup_parent: tdsbaassupabasevps16.slice
  restart: "no"
services:
  db:
    <<: *serving
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private environment file required}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      PGPORT: "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgconfig:/etc/postgresql-custom
      - ./bootstrap/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./bootstrap/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, shared_buffers=512MB, -c, effective_cache_size=2GB, -c, max_connections=100, -c, log_min_messages=fatal, -c, log_statement=none, -c, synchronous_commit=on, -c, fsync=on]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 40
  auth:
    <<: *serving
    image: supabase/gotrue:v2.196.0@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:${SUPABASE_PORT:-14000}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:${SUPABASE_PORT:-14000}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${NATIVE_JWT_SECRET:?private native key required}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 10s
      timeout: 5s
      retries: 20
  rest:
    <<: *serving
    image: postgrest/postgrest:v14.17@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: feed_api
      PGRST_DB_ANON_ROLE: feed_reader
      PGRST_JWT_SECRET: ${NATIVE_JWT_SECRET}
      PGRST_JWT_CACHE_MAX_LIFETIME: "0"
      PGRST_DB_TX_END: commit
      PGRST_DB_POOL: "10"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 20
  functions:
    <<: *serving
    image: supabase/edge-runtime:v1.76.2@sha256:edd22bef4477b900d5c300e287ce9b18bff9b81a0291bee14ee0b7c7b71a2899
    depends_on:
      db: {condition: service_healthy}
    environment:
      COMPAT_JWT_SECRET: ${COMPAT_JWT_SECRET:?private compatibility key required}
      NATIVE_JWT_SECRET: ${NATIVE_JWT_SECRET}
      SUPABASE_ANON_KEY: ${ANON_KEY:?private runtime config required}
      REST_URL: http://gateway:8000/rest/v1
    volumes:
      - ./functions:/home/deno/functions:ro
      - denocache:/root/.cache/deno
    command: [start, --user-worker-request-idle-timeout, "150000", --main-service, /home/deno/functions/main]
    healthcheck:
      test: [CMD-SHELL, "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20
  gateway:
    <<: *serving
    image: envoyproxy/envoy:v1.39.1@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
    ports: ["127.0.0.1:${SUPABASE_PORT:-14000}:8000"]
    volumes:
      - ../../.state/supabase/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: [envoy, -c, /etc/envoy/envoy.yaml, --concurrency, "1", --log-level, warning]
    depends_on:
      functions: {condition: service_started}
      auth: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 20
  tools:
    profiles: [tools]
    image: baas-trailbase-vps16-tools:0.1.0
    platform: linux/amd64
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    working_dir: /work
    volumes:
      - ../../:/work:ro
      - ../../.state/supabase:/state
      - ../../.state/seed:/seed
    environment:
      BASE_URL: http://gateway:8000
      REST_URL: http://rest:3000
  k6:
    profiles: [load]
    image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
    platform: linux/amd64
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g
    user: "0:0"
    volumes:
      - ../../bench:/work/bench:ro
      - ../../.state/seed/tokens.json:/tokens.json:ro
      - ../../.state/supabase/runs:/runs
    environment:
      BASE_URL: http://gateway:8000
volumes:
  pgdata:
    # First failed initialization is retained in the original ..._pgdata volume.
    name: baas-supabase-vps16_pgdata2
  pgconfig:
  denocache:
