# Native Envoy gateway. Runtime ANON key substitution stays in ignored private state.
static_resources:
  listeners:
  - name: api
    address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: supabase_api
          codec_type: AUTO
          route_config:
            name: api_routes
            virtual_hosts:
            - name: api
              domains: ['*']
              routes:
              - match: {prefix: /rest/v1/}
                route: {cluster: rest, prefix_rewrite: /, timeout: 15s}
              - match: {prefix: /auth/v1/}
                route: {cluster: auth, prefix_rewrite: /, timeout: 15s}
              - match: {prefix: /functions/v1/}
                route: {cluster: functions, prefix_rewrite: /, timeout: 15s}
              - match: {prefix: /}
                route: {cluster: functions, timeout: 15s}
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  function envoy_on_request(handle)
                    local path = handle:headers():get(':path') or ''
                    if string.find(path, '^/rest/v1/') or string.find(path, '^/auth/v1/') then
                      if handle:headers():get('apikey') ~= '@@ANON_KEY@@' then
                        handle:respond({[':status']='401', ['content-type']='application/json'}, '{"message":"Invalid API key"}')
                        return
                      end
                      if not handle:headers():get('authorization') then
                        handle:headers():add('authorization', 'Bearer @@ANON_KEY@@')
                      end
                    end
                  end
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: rest
    connect_timeout: 2s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: rest
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: rest, port_value: 3000}}}
  - name: auth
    connect_timeout: 2s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: auth, port_value: 9999}}}
  - name: functions
    connect_timeout: 2s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: functions
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: functions, port_value: 9000}}}
