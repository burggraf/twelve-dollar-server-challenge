[package]
name = "feed-benchmark"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.23.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
trailbase-wasm = "=0.6.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
